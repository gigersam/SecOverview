<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3‑Step Instruction</title>
  <style>
    :root{
      --bg: #0f172a;       /* slate-900 */
      --card: #111827cc;   /* semi‑transparent gray-900 */
      --text: #e5e7eb;     /* gray-200 */
      --muted:#9ca3af;     /* gray-400 */
      --accent: #60a5fa;   /* blue-400 */
      --accent-2: #34d399; /* emerald-400 */
      --ring: #93c5fd55;   /* blue-300/33 */
      --shadow: 0 20px 60px rgba(0,0,0,.45), 0 2px 10px rgba(0,0,0,.25);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1d4ed8 0%, transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, #059669 0%, transparent 60%),
        linear-gradient(180deg, #0b1022, #0f172a 60%);
      display:grid;
      place-items:center;
      padding: 32px;
    }

    .card{
      width:min(880px, 100%);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 36px);
    }

    .title{
      display:flex; align-items:center; gap:12px;
      font-size: clamp(22px, 2.5vw, 30px);
      font-weight:700;
      letter-spacing:.2px;
      margin: 0 0 12px 0;
    }
    .subtitle{ color: var(--muted); margin:0 0 24px 0; }

    .steps{ display:grid; gap:18px; counter-reset: step; }
    .step{
      position:relative;
      display:grid; gap:8px;
      grid-template-columns: 52px 1fr auto;
      align-items:start;
      padding:14px 14px 14px 0;
      border-radius: 16px;
    }
    .step::before{
      counter-increment: step;
      content: counter(step);
      display:grid; place-items:center;
      width: 44px; height: 44px;
      margin-right: 8px;
      border-radius: 12px;
      background: #0b1228;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      font-weight: 800; color: #c7d2fe;
    }
    .step h3{ margin:0; font-size: 18px; letter-spacing:.2px; }
    .step p{ margin:0; color: var(--muted); font-size: 14px; }

    .kbd { 
      display:inline-grid; place-items:center; 
      padding: 6px 10px; border-radius: 10px; 
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.08);
      font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
      color:#cbd5e1;
      white-space:nowrap;
    }

    .codebox{
      grid-column: 2 / 4;
      display:flex; gap:8px; align-items:stretch; width:100%;
      margin-top:4px;
    }
    .codebox input{
      flex:1; min-width:0;
      font: 600 14px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color:#e5e7eb; background:#0b1228; border:1px solid rgba(255,255,255,.1);
      padding:14px 14px; border-radius: 14px;
      outline:none;
    }
    .codebox input:focus{ box-shadow: 0 0 0 6px var(--ring); border-color:#93c5fd; }

    .btn{
      appearance:none; cursor:pointer; user-select:none;
      font-weight:700; letter-spacing:.3px;
      padding: 12px 14px; border-radius: 12px; border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(96,165,250,.25), rgba(96,165,250,.15));
      color:white;
      transition: transform .05s ease, filter .2s ease, background .2s ease;
    }
    .btn:hover{ filter: brightness(1.04); }
    .btn:active{ transform: translateY(1px); }

    .note{ margin-top: 8px; font-size: 12px; color: #a5b4fc; }

    .footer{
      margin-top: 26px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      color: var(--muted); font-size: 12px;
    }
    .footer a{ color: #93c5fd; text-decoration: none; }
    .footer a:hover{ text-decoration: underline; }

    @media (max-width: 520px){
      .step{ grid-template-columns: 44px 1fr; }
      .codebox{ grid-column: 2 / 3; flex-direction: column; }
      .btn{ width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1 class="title">Quick 3‑Step Guide</h1>
    <p class="subtitle">Use the steps below to copy your command and run it with a single keystroke.</p>

    <section class="steps" aria-label="Steps">
      <!-- Step 1 -->
      <div class="step">
        <h3>Select the command</h3>
        <!--<p>Adjust the command if needed before you copy and run it.</p>-->
        <div class="codebox">
          <input id="commandInput" value="{{ command|safe }}" aria-label="Command to copy" readonly />
          <button class="btn" id="copyBtn" aria-live="polite" aria-label="Copy command">Copy</button>
        </div>
        <div id="copyNote" class="note" role="status" aria-live="polite"></div>
      </div>

      <!-- Step 2 -->
      <div class="step">
        <h3>Copy command</h3>
        <p>Click <em>Copy</em> or press <span class="kbd">Ctrl</span> + <span class="kbd">C</span>.</p>
      </div>

      <!-- Step 3 -->
      <div class="step">
        <h3>Press <span class="kbd">Ctrl</span> + <span class="kbd">R</span> to execute</h3>
        <p>Your tool will execute the copied command. (On macOS, try <span class="kbd">⌘</span> + <span class="kbd">R</span> if applicable.)</p>
      </div>
    </section>
<!--
    <div class="footer">
      <span>Tip: You can paste a different command into the box above.</span>
      <a href="#" id="downloadHtml">Download this page</a>
    </div>
 -->
  </main>

  <script>
    const input = document.getElementById('commandInput');
    const copyBtn = document.getElementById('copyBtn');
    const copyNote = document.getElementById('copyNote');
    const downloadLink = document.getElementById('downloadHtml');

    async function copyCommand(){
      const text = input.value || '';
      try{
        await navigator.clipboard.writeText(text);
        copyNote.textContent = 'Copied to clipboard!';
        copyBtn.textContent = 'Copied';
        copyBtn.style.background = 'linear-gradient(180deg, rgba(52,211,153,.25), rgba(52,211,153,.15))';
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.style.background = ''; copyNote.textContent = ''; }, 1600);
      }catch(err){
        copyNote.textContent = 'Copy failed. Select text and press Ctrl+C.';
      }
    }

    copyBtn.addEventListener('click', copyCommand);
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
        e.preventDefault();
        copyCommand();
      }
    });

    window.addEventListener('load', () => {
    const textToCopy = "Copied automatically!";
    navigator.clipboard.writeText(textToCopy)
      .catch(err => {
        console.error("Auto copy failed: ", err);
      });
    });

  </script>
</body>
</html>

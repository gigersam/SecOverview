{% extends "layout.html" %}

{% block content %}
<div class="p-4">
    <div class="d-grid gap-4 d-md-flex">
        <h3>Connected Bots</h3> 
        <a href="{% url 'c2payloads' %}"><button class="btn btn-dark">Create Payloads</button></a>
        <a href="{% url 'c2campaign' %}"><button class="btn btn-dark">Campaigns</button></a>
    </div>
    <div class="d-grid gap-4 d-md-flex">
      <table class="table table-hover">
          <tr>
              <td><b>Online</b></td>
              <td><b>Bot Name</b></td>
              <td><b>IP-Address</b></td>
              <td><b>System Info</b></td>
          </tr>
          {% for bot in bots %}
          <tr>
            <td>{{ bot.last_seen }}</td>
            <td><a href="{% url 'c2bot_detail' bot.id %}">{{ bot.uuid }}</a></td>
            <td>{{ bot.ip_address }}</td>
            <td>{{ bot.system_info }}</td>
          </tr>
          {% endfor %}
      </table>
    </div>
</div>


{% endblock %}
